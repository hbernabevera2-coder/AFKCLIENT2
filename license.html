<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AFK Manager Pro · Activation</title>
    <style>
        /* [Styles remain the same as they don't contain visible text] */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0b0b12, #030307);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #f0f0fc;
        }

        .glass-card {
            background: rgba(18, 20, 30, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(124, 106, 247, 0.45);
            border-radius: 40px;
            padding: 48px 40px;
            width: 560px;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(124, 106, 247, 0.2);
            transition: all 0.2s ease;
        }

        .glass-card:hover {
            border-color: rgba(124, 106, 247, 0.7);
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(124, 106, 247, 0.4);
        }

        .icon-lock {
            background: linear-gradient(135deg, #7c6af7, #a78bfa);
            width: 80px;
            height: 80px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 24px -8px rgba(124, 106, 247, 0.5);
        }

        .icon-lock i {
            font-size: 40px;
            color: white;
        }

        h2 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #ffffff, #c0b5ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }

        .sub {
            color: #b0b0d0;
            font-size: 0.9rem;
            margin-bottom: 32px;
            border-bottom: 1px dashed rgba(124, 106, 247, 0.4);
            display: inline-block;
            padding-bottom: 6px;
        }

        .hwid-box {
            background: #0a0a18;
            border: 1px solid #3a3a5a;
            border-radius: 24px;
            padding: 16px 20px;
            margin: 24px 0;
            transition: all 0.2s;
            cursor: default;
            word-break: break-all;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.4px;
            color: #cbcbff;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.03);
        }

        .hwid-box:hover {
            background: #101024;
            border-color: #7c6af7;
            box-shadow: 0 0 16px rgba(124,106,247,0.3);
        }

        .hwid-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: #8a8aba;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .hwid-label i {
            font-size: 14px;
        }

        #hwidValue {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin: 28px 0 20px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: #0c0c1a;
            border: 1px solid #3a3a5a;
            border-radius: 48px;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            letter-spacing: 1px;
            text-align: center;
            transition: all 0.2s;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        input:focus {
            outline: none;
            border-color: #7c6af7;
            box-shadow: 0 0 0 3px rgba(124, 106, 247, 0.2), inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .btn-activate {
            background: linear-gradient(95deg, #7c6af7, #9a86ff);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 48px;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s;
            box-shadow: 0 10px 24px -6px rgba(124, 106, 247, 0.6);
            margin-top: 16px;
        }

        .btn-activate:hover {
            background: linear-gradient(95deg, #6a58e5, #8b75ff);
            transform: translateY(-2px);
            box-shadow: 0 18px 28px -10px rgba(124, 106, 247, 0.8);
        }

        .btn-activate:active {
            transform: translateY(1px);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-top: 24px;
            font-size: 0.85rem;
            padding: 10px 16px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            width: 100%;
            justify-content: center;
        }

        .error-msg {
            color: #ffaa99;
            border-left: 3px solid #f04444;
            background: rgba(240, 68, 68, 0.1);
        }

        .success-msg {
            color: #9affd0;
            border-left: 3px solid #22d3a0;
            background: rgba(34, 211, 160, 0.1);
        }

        .info-text {
            font-size: 0.75rem;
            color: #a0a0c0;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        i {
            color: #7c6af7;
        }

        footer {
            margin-top: 16px;
            font-size: 0.7rem;
            color: #6f6f92;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="glass-card">
        <div class="icon-lock">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h2>AFK Manager Pro</h2>
        <div class="sub">AFK CLIENT security activation</div>

        <div class="hwid-box" id="hwidDisplay">
            <div class="hwid-label">
                <i class="fas fa-desktop"></i> DEVICE FINGERPRINT
            </div>
            <span id="hwidValue">🔄 Obtaining identifier...</span>
        </div>

        <div class="input-group">
            <input type="text" id="licenseKey" placeholder="AFK CLIENT-••••••••••" autocomplete="off">
        </div>

        <button id="activateBtn" class="btn-activate">
            <i class="fas fa-unlock-alt"></i> Activate License
        </button>

        <div id="statusMsg" class="message" style="display: none;"></div>

        <div class="info-text">
            <i class="fas fa-link"></i> Your device will be automatically linked upon entering the key.
        </div>
        <footer>v1.0 · AFK CLIENT Security System</footer>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const hwidSpan = document.getElementById('hwidValue');
        const licenseInput = document.getElementById('licenseKey');
        const activateBtn = document.getElementById('activateBtn');
        const statusDiv = document.getElementById('statusMsg');

        let currentHWID = null;

        function showMessage(text, isError = true) {
            statusDiv.style.display = 'flex';
            statusDiv.innerHTML = isError ? `<i class="fas fa-exclamation-triangle"></i> ${text}` : `<i class="fas fa-check-circle"></i> ${text}`;
            statusDiv.className = `message ${isError ? 'error-msg' : 'success-msg'}`;
            if (!isError) return;
            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }

        async function loadHWID() {
            try {
                hwidSpan.innerText = '⌛ Analyzing device...';
                const hwid = await ipcRenderer.invoke('get-hwid');
                if (!hwid || hwid === 'undefined' || hwid === '') {
                    throw new Error('Empty HWID');
                }
                currentHWID = hwid;
                hwidSpan.innerText = "READY TO BIND";
                hwidSpan.style.color = '#9affd0'; // Green indicating it's ready
            } catch (err) {
                console.error('[License] Error obtaining HWID:', err);
                hwidSpan.innerText = '⚠️ System read error';
                hwidSpan.style.color = '#ff8888';
                showMessage('Could not identify the device. Please contact support.', true);
                activateBtn.disabled = true;
                activateBtn.style.opacity = '0.5';
                activateBtn.style.cursor = 'not-allowed';
            }
        }

        async function activateLicense() {
            const key = licenseInput.value.trim().toUpperCase();
            if (!key) {
                showMessage('Please enter your License Key', true);
                return;
            }

            if (!currentHWID) {
                showMessage('System error: HWID not available.', true);
                return;
            }

            const originalText = activateBtn.innerHTML;
            activateBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Verifying & Binding...';
            activateBtn.disabled = true;

            try {
                // main.js handles all database and Webhook tasks
                const result = await ipcRenderer.invoke('activate-license', { licenseKey: key });
                
                if (result.success) {
                    showMessage('✅ Access granted. Opening panel...', false);
                } else {
                    showMessage(result.message || '❌ Invalid Key or linked to another device', true);
                    activateBtn.innerHTML = originalText;
                    activateBtn.disabled = false;
                }
            } catch (error) {
                console.error('[License] Activation error:', error);
                showMessage('Communication error with the server.', true);
                activateBtn.innerHTML = originalText;
                activateBtn.disabled = false;
            }
        }

        activateBtn.addEventListener('click', activateLicense);
        licenseInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') activateLicense();
        });

        // Auto-focus the input for convenience
        window.addEventListener('DOMContentLoaded', () => {
            licenseInput.focus();
        });

        loadHWID();
    </script>
</body>
</html>
